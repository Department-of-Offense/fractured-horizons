name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # LFS files (art, audio) aren't needed for logic tests. Skipping them saves
      # LFS bandwidth quota, which applies even to public repos. Set lfs: true
      # once tests depend on real assets.
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Check vendored engine matches ENGINE_VERSION
        run: |
          ref="$(sed -n 1p ENGINE_VERSION)"; sha="$(sed -n 2p ENGINE_VERSION)"
          echo "Engine: $ref ($sha)"
          if [[ "$ref" == local:* ]]; then
            echo "::warning::Engine was synced from a local checkout ($ref). Sync a tagged release before merging."
            exit 0
          fi
          git init -q /tmp/engine
          git -C /tmp/engine fetch -q --depth 1 https://github.com/Department-of-Offense/command-engine.git "$sha"
          git -C /tmp/engine checkout -q FETCH_HEAD
          if ! diff -r --strip-trailing-cr /tmp/engine/addons/command_engine addons/command_engine; then
            echo "::error::addons/command_engine was edited by hand. Change the engine repo, then run tools/sync-engine.sh."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot (.NET)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip

      - name: Put Godot on PATH
        run: |
          bin="$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64' | head -n1)"
          chmod +x "$bin"
          mkdir -p ~/.local/bin && ln -sf "$bin" ~/.local/bin/godot
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build C#
        run: dotnet build --nologo -warnaserror

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . res://tests/TestRunner.tscn 2>&1 | tee test.log
          if grep -qE '^(SCRIPT )?ERROR' test.log; then echo "::error::Engine errors were logged during tests"; exit 1; fi

      - name: Main scene smoke run
        run: |
          godot --headless --fixed-fps 60 --path . --quit-after 1800 2>&1 | tee demo.log
          if grep -qE '^(SCRIPT )?ERROR' demo.log; then echo "::error::Engine errors were logged in the main scene"; exit 1; fi
