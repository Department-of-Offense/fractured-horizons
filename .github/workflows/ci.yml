name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The nightly canary (canary.yml) reuses this workflow with systems_ref: main.
  workflow_call:
    inputs:
      systems_ref:
        description: Re-sync godot-systems from this ref before testing instead of checking the vendored copy
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.systems_ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  SYSTEMS_REPO: https://github.com/Department-of-Offense/godot-systems.git
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # LFS files (art, audio) aren't needed for logic tests. Skipping them saves
      # LFS bandwidth quota, which applies even to public repos. Set lfs: true
      # once tests depend on real assets.
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Re-sync systems from ${{ inputs.systems_ref }}
        if: inputs.systems_ref != ''
        run: bash tools/sync-systems.sh "${{ inputs.systems_ref }}"

      - name: Check vendored systems match SYSTEMS_VERSION
        if: inputs.systems_ref == ''
        run: |
          ref="$(sed -n 1p SYSTEMS_VERSION)"; sha="$(sed -n 2p SYSTEMS_VERSION)"; modules="$(sed -n 3p SYSTEMS_VERSION)"
          echo "Systems: $ref ($sha)"
          echo "Modules: $modules"
          if [[ "$ref" == local:* ]]; then
            echo "::warning::Systems were synced from a local checkout ($ref). Sync a tagged release before merging."
            exit 0
          fi
          git init -q /tmp/systems
          git -C /tmp/systems fetch -q --depth 1 "$SYSTEMS_REPO" "$sha"
          git -C /tmp/systems checkout -q FETCH_HEAD
          status=0
          for m in $modules; do
            if ! diff -r --strip-trailing-cr "/tmp/systems/addons/$m" "addons/$m"; then
              echo "::error::addons/$m differs from godot-systems $ref. Change godot-systems, then run tools/sync-systems.sh."
              status=1
            fi
          done
          for dir in addons/dof_*; do
            name="$(basename "$dir")"
            if [[ " $modules " != *" $name "* ]]; then
              echo "::error::addons/$name is not listed in SYSTEMS_VERSION. Use tools/sync-systems.sh to add modules."
              status=1
            fi
          done
          exit $status

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot (.NET)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip

      - name: Put Godot on PATH
        run: |
          bin="$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64' | head -n1)"
          chmod +x "$bin"
          mkdir -p ~/.local/bin && ln -sf "$bin" ~/.local/bin/godot
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build C#
        run: dotnet build --nologo -warnaserror

      - name: Import project
        run: godot --headless --path . --import

      - name: Lab tests
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . res://tests/TestRunner.tscn 2>&1 | tee test.log
          if grep -qE '^(SCRIPT )?ERROR' test.log; then echo "::error::Engine errors were logged during tests"; exit 1; fi

      - name: Skirmish smoke run (30 s of AI vs AI)
        run: |
          godot --headless --fixed-fps 60 --path . --quit-after 1800 -- --lab=skirmish 2>&1 | tee smoke.log
          if grep -qE '^(SCRIPT )?ERROR' smoke.log; then echo "::error::Engine errors were logged in the skirmish"; exit 1; fi

      - name: Performance snapshot (informational)
        run: |
          {
            echo "### Stress lab, headless, 600 frames incl. startup"
            echo "| units per side | ms per frame |"
            echo "|---|---|"
            for n in 60 120 200; do
              start=$(date +%s%N)
              godot --headless --fixed-fps 60 --path . --quit-after 600 -- --lab=stress --units=$n > /dev/null 2>&1
              echo "| $n | $(( ($(date +%s%N) - start) / 600000000 )) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
